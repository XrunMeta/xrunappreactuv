<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRUN 앱으로 이동</title>

    <!-- Open Graph 메타 태그 (카카오톡, 페이스북 등 링크 미리보기용) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="XRUN 레퍼럴 초대 - 함께 5 XRUN 받기">
    <meta property="og:description" content="함께할수록 커지는 혜택, XRUN 레퍼럴 이벤트에 참여하세요! 신규 가입 시 5 XRUN 지급 (초대자 & 가입자 전원)">
    <meta property="og:image" content="https://www.xrun.run/assets/referral-invitation-image.png">
    <meta property="og:url" content="https://www.xrun.run/invite">
    <meta property="og:site_name" content="XRUN">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- 카카오톡 링크 미리보기용 추가 메타 태그 -->
    <meta property="og:image:type" content="image/png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="XRUN 레퍼럴 초대 - 함께 5 XRUN 받기">
    <meta name="twitter:description" content="함께할수록 커지는 혜택, XRUN 레퍼럴 이벤트에 참여하세요!">
    <meta name="twitter:image" content="https://www.xrun.run/assets/referral-invitation-image.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #343a5a 0%, #1a1f36 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            color: #10192d;
            margin-bottom: 12px;
        }

        .description {
            font-size: 16px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .referral-info {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
            margin: 20px 0;
        }

        .referral-label {
            font-size: 14px;
            color: #8e9bae;
            margin-bottom: 4px;
        }

        .referral-email {
            font-size: 16px;
            font-weight: 600;
            color: #343a5a;
            word-break: break-all;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 24px 0;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #e0e0e0;
            border-top-color: #343a5a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 14px;
            color: #666;
        }

        .redirect-text {
            font-size: 14px;
            color: #999;
            margin-top: 16px;
        }

        .buttons {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            display: block;
            padding: 16px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: #343a5a;
            color: white;
        }

        .btn-secondary {
            background: #ffdc04;
            color: #10192d;
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- XRUN 로고 -->
        <!-- <img src="https://xrun.run/assets/xrun-round-logo.png" alt="XRUN 로고" class="logo"> -->

        <h1 class="title">XRUN 앱으로 이동</h1>
        <p class="description">회원가입 시 아래 추천인 코드가 자동으로 입력됩니다.</p>

        <div class="referral-info">
            <div class="referral-label">추천인 코드</div>
            <div class="referral-email" id="referralEmail">-</div>
        </div>

        <div class="loading" id="loadingSection">
            <div class="spinner"></div>
            <span class="loading-text">앱으로 이동 중...</span>
        </div>
        <p class="redirect-text" id="redirectText"></p>

        <!-- 앱 열기 버튼 (앱이 안 열렸을 때 표시) -->
        <div class="buttons" id="buttonSection">
            <button class="btn btn-primary" id="openAppBtn">앱 열기</button>
            <button class="btn btn-secondary" id="storeBtn">앱 설치하기</button>
        </div>

        <div class="footer">
            © 2025 XRUN. All rights reserved.
        </div>
    </div>

    <script>

        const params = new URLSearchParams(window.location.search);
        const referral = params.get('referral') || '';
        const decodedReferral = decodeURIComponent(referral);

        document.getElementById('referralEmail').textContent = decodedReferral || '없음';

        const appScheme = `xrun://signup?referral=${referral}`;

        const androidStoreUrl = `https://play.google.com/store/apps/details?id=run.xrun.xrunapp&referrer=utm_source%3Dreferral%26utm_content%3D${referral}`;
        const iosStoreUrl = 'https://apps.apple.com/id/app/xrun-go/id6502924173';

        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
        const isAndroid = /android/i.test(userAgent);
        const isMobile = isIOS || isAndroid;

        function getStoreUrl() {
            if (isIOS) return iosStoreUrl;
            if (isAndroid) return androidStoreUrl;

            return androidStoreUrl;
        }

        async function copyReferralToClipboard() {
            if (!isIOS || !referral) return;

            try {

                const clipboardData = `XRUN_REFERRAL:${decodedReferral}`;
                await navigator.clipboard.writeText(clipboardData);
                console.log('[iOS] 클립보드에 추천인 정보 저장:', clipboardData);
            } catch (error) {
                console.error('[iOS] 클립보드 저장 실패:', error);
            }
        }

        let appOpened = false;

        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                appOpened = true;
            }
        });

        window.addEventListener('blur', function () {
            appOpened = true;
        });

        function tryOpenApp() {
            const redirectText = document.getElementById('redirectText');

            window.location.href = appScheme;

            setTimeout(() => {

                if (appOpened) {
                    return;
                }

                if (isMobile) {
                    redirectText.textContent = '앱이 설치되어 있지 않습니다. 스토어로 이동합니다...';

                    if (isIOS) {
                        copyReferralToClipboard();
                    }

                    setTimeout(() => {
                        window.location.href = getStoreUrl();
                    }, 1000);
                } else {

                    document.getElementById('loadingSection').style.display = 'none';
                    document.getElementById('redirectText').style.display = 'none';
                    document.getElementById('buttonSection').style.display = 'flex';
                }
            }, 2000);
        }

        window.onload = tryOpenApp;

        document.getElementById('openAppBtn').addEventListener('click', function () {
            window.location.href = appScheme;
        });

        document.getElementById('storeBtn').addEventListener('click', function () {
            window.location.href = getStoreUrl();
        });
    </script>
</body>

</html>
