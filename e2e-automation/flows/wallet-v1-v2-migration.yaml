# T-097 — v1 → v2 지갑 vault 마이그레이션 실기 전체 실측
#
# 【검증함】 실제 Keychain KEK · 실제 AsyncStorage · 실제 암복호 · 실제 모달/키패드로
#          v1 항목이 v2 로 재봉투되어 **저장까지** 완료되는가
# 【확인 못 함】 로그인·서버 키 수령(`/wallets/keys`)·키볼트 — 부르지 않는다.
#          개인키는 하니스가 매 실행 생성하는 테스트 키다 (실사용자 키 아님)
#
# 🔑 왜 심어야 하는가: 현재 코드에는 v1 을 만드는 경로가 없다
#    (setupPinForUser·restoreBackup 둘 다 ver:2 로 저장). v1 은 구버전 앱이 남긴
#    것으로만 존재하므로, 라이브로 로그인해 키를 받아와도 마이그 대상이 안 생긴다.
#
# 🔴 웹으로 하면 무효다 — expo-secure-store 의 web 구현이 빈 껍데기라 KEK 가 가짜가 된다.
#    이 플로우만은 시뮬레이터에서 돌린다.
#
# ── 실행 ────────────────────────────────────────────────────────────────
#   EXPO_PUBLIC_E2E_HARNESS=wallet-migration npx expo start --port 8081 --clear
#   xcrun simctl openurl <SIM> "run.xrun.xrunapps://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
#   maestro test e2e-automation/flows/wallet-v1-v2-migration.yaml
#
# ── 실측으로 데인 것 ────────────────────────────────────────────────────
# · scrypt(N=2^14) 가 iOS 에서 5~7초 걸린다. 마이그는 eth·pol 두 번 도니 넉넉히 기다린다.
#   짧게 잡으면 "마이그 실패" 가 아니라 "아직 안 끝남" 인데 실패로 읽힌다.
# · 판정은 화면 텍스트의 **값**으로 한다(ver=2 / detectLegacyEntries=false).
#   "모달이 닫혔다" 는 판정이 아니다 — 취소해도 닫힌다.
#   변이로 확인함: lazy 마이그를 끄면 onSuccess 는 그대로 통과하고 MIGRATION_DONE 만 실패한다.
# · 번역 문구로 판정하지 않는다. 하니스에는 저장 언어가 없어 en 으로 뜬다(실측).
# · `takeScreenshot` 은 프로젝트가 아니라 **Maestro 아티팩트 폴더**에 쓴다:
#     ~/.maestro/tests/<실행>/wallet-v1-v2-migration/takeScreenshot/<여기 적은 경로>
#   자산으로 남기려면 거기서 복사해 온다. 프로젝트 폴더를 보고 "안 찍혔다" 로 읽기 쉽다.

appId: run.xrun.xrunapps
---
- assertVisible: "v1 → v2 마이그레이션 실측"
- assertVisible: "oth-test@example.invalid · member 999001 · PIN 123456"

# ── 1. v1 항목 심기 (vault 초기화 + KEK 삭제 후) ────────────────────────
- tapOn:
    id: "mig-seed"
- extendedWaitUntil:
    visible: "detectLegacyEntries=true"
    timeout: 20000

# 심은 직후 상태를 못 박는다 — 여기서 이미 ver=2 면 초기화가 안 된 것이고,
# 그 상태로 진행하면 "마이그 성공" 이 거짓으로 나온다.
- assertVisible: "eth: ver=v1 s=s1"
- assertVisible: "pol: ver=v1 s=s1"
- assertVisible: "MIGRATION_PENDING"
- takeScreenshot: e2e-automation/screenshots/wallet-v1-v2-migration/01-v1-심은-직후

# ── 2. 실제 PIN 모달 → 실제 키패드로 123456 ────────────────────────────
- tapOn:
    id: "mig-open"
# 🔑 번역 문구로 판정하지 않는다. 하니스에는 저장된 언어가 없어 en 으로 뜨고,
#    기기 언어에 따라 또 달라진다 — 실측으로 데였다. 식별자로 본다.
- assertVisible:
    id: "wallet-key-pin-prompt-title-label"
- takeScreenshot: e2e-automation/screenshots/wallet-v1-v2-migration/02-PIN-모달

# 🔑 숫자도 텍스트로 누르지 않는다. 뒤 화면의 "1. v1 항목 심기" 가 같이 잡힌다.
- tapOn:
    id: "wallet-key-pin-prompt-key-1"
- tapOn:
    id: "wallet-key-pin-prompt-key-2"
- tapOn:
    id: "wallet-key-pin-prompt-key-3"
- tapOn:
    id: "wallet-key-pin-prompt-key-4"
- tapOn:
    id: "wallet-key-pin-prompt-key-5"
- tapOn:
    id: "wallet-key-pin-prompt-key-6"

# 6자리 채우면 자동 검증 → unlockUserWallets → lazy 마이그 → onSuccess.
# scrypt 가 network 마다 도니 오래 걸린다. 성공 조건 하나를 길게 기다린다.
- extendedWaitUntil:
    visible: "모달 onSuccess — 마이그 저장 완료 시점"
    timeout: 90000

# ── 3. 저장 결과 판정 ───────────────────────────────────────────────────
- tapOn:
    id: "mig-refresh"
- extendedWaitUntil:
    visible: "MIGRATION_DONE"
    timeout: 20000
- assertVisible: "eth: ver=2 s=s1"
- assertVisible: "pol: ver=2 s=s1"
- assertVisible: "detectLegacyEntries=false"
- takeScreenshot: e2e-automation/screenshots/wallet-v1-v2-migration/03-v2-마이그-완료
