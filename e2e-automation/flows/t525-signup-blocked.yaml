# T-525 2단계 — 등록된 기기에서 회원가입이 막히고 해제 요청 팝업이 뜨는가
#
# 【검증함】 앱 UI 로 가입을 시도했을 때
#           - 409 blocked_device_used 를 받아 팝업이 뜨는가
#           - unblockRequestable=true 면 "차단 해제 요청" 버튼이 나오는가
# 【확인 못 함】 서버 판정 자체 — 그건 API 직접 호출과 vitest 로 검증한다.
#              device_unblock_requests 적재 — 러너가 로컬 D1 을 조회해 판정한다.
#
# 전제:
#   1. 이 기기의 device_key 가 이미 device_registry 에 있어야 한다
#      (t525-login-only.yaml 을 먼저 돌려 등록시킨다)
#   2. 로컬 wrangler dev 8790 기동 · 마이그 108·109 적용
#
# 인증코드는 로컬 D1 의 Txn(action=9712, extrastr=이메일, extrastr2=코드)에 남는다.
# 이 플로우는 코드를 스스로 알 수 없다 — 러너가 꺼내 다음 단계에 넘긴다.
#
# 셀렉터 메모: 라벨과 입력 필드가 별개다. 플레이스홀더 문구를 타깃으로 한다.
#   앱 언어가 시뮬 시스템 언어를 따르므로(clearState 후 일본어) 언어에 묶지 않는다.
#
# ⚠️ 로컬 전용 (스킬 §5).

appId: ${APP_ID}
---
- launchApp:
    clearState: true

- runFlow: _dev-entry.yaml

- extendedWaitUntil:
    visible:
      text: "회원가입|会員登録|Sign up"
    timeout: 60000

- tapOn:
    text: "회원가입|会員登録|Sign up"

- extendedWaitUntil:
    visible:
      text: "이름을 입력.*|名を入力してください.*"
    timeout: 20000

- tapOn:
    text: "이름을 입력.*|名を入力してください.*"
- inputText: "E2E Block"

- tapOn:
    text: "이메일을 입력.*|メールアドレスを入力してください.*"
- inputText: ${SIGNUP_EMAIL}

- tapOn:
    text: "Password"
- inputText: "Test1234!"

- tapOn:
    text: "비밀번호를 다시.*|パスワードをもう一度入力してください.*"
- inputText: "Test1234!"

# 가입 버튼과 약관은 스크롤 아래에 있다
- scroll
- scroll

# 약관 3종 동의 (전부 필수)
- tapOn:
    text: ".*서비스 약관.*|.*XRUNサービス規約.*"
- tapOn:
    text: ".*위치정보.*|.*個人位置情報規約.*"
- tapOn:
    text: ".*개인정보.*|.*個人情報利用規約.*"

- tapOn:
    text: "가입하기|등록하기|登録する|Sign up"

# 여기서 이메일 인증 화면으로 넘어간다. 인증코드는 러너가 D1 에서 꺼내 넣는다.
- extendedWaitUntil:
    notVisible:
      text: "가입하기|등록하기|登録する|Sign up"
    timeout: 30000
